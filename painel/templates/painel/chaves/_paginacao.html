{% if pagina.paginator.num_pages > 1 %}
<div class="paginacao">
  <span class="suave pequeno">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} {{ rotulo }}</span>
  {% if pagina.has_previous %}<a class="btn p" href="?{{ parametros }}&pagina={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}
  {% if pagina.has_next %}<a class="btn p" href="?{{ parametros }}&pagina={{ pagina.next_page_number }}">Próxima →</a>{% endif %}
</div>
{% endif %}
