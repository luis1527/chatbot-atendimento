{% if tipo == 'retirada' %}<span class="badge info">📤 {{ rotulo }}</span>{% elif tipo == 'devolucao' %}<span class="badge sucesso">↩ {{ rotulo }}</span>{% elif tipo == 'manutencao' %}<span class="badge alerta">🛠 {{ rotulo }}</span>{% elif tipo == 'perda' %}<span class="badge perigo-claro">⚠ {{ rotulo }}</span>{% elif tipo == 'liberacao' %}<span class="badge sucesso">✅ {{ rotulo }}</span>{% else %}<span class="badge cinza">➕ {{ rotulo }}</span>{% endif %}
